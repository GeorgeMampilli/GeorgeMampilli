<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Task Notepad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: a slim view switcher on the left (Board / List), and the workspace beside it — header,
     the new-ticket form, toolbar, then either four paper columns of ticket cards or one list.
     Opening a ticket shows its full details in a panel (a bottom sheet on phones). */
  :root {
    --desk: #e9ecef;
    --paper: #fbf8e9;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #64707d;
    --accent: #2457c5;
    --accent-ink: #ffffff;
    --accent-soft: #dfe8fb;
    --field: #ffffff;
    --line: #d6d9d2;
    --rule: #c9d8ea;
    --scrim: rgb(17 21 27 / .45);
    --high: #c23a31;
    --med: #b0700c;
    --low: #2f8551;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #11151b; --paper: #1a2029; --card: #232b36; --ink: #e7ebf0; --muted: #94a0ae;
      --accent: #7ea3ff; --accent-ink: #0d1422; --accent-soft: #23324d; --field: #222a35; --line: #313b49; --rule: #263142;
      --scrim: rgb(0 0 0 / .6); --high: #ff8278; --med: #f0b24a; --low: #6fd093;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #11151b; --paper: #1a2029; --card: #232b36; --ink: #e7ebf0; --muted: #94a0ae;
    --accent: #7ea3ff; --accent-ink: #0d1422; --accent-soft: #23324d; --field: #222a35; --line: #313b49; --rule: #263142;
    --scrim: rgb(0 0 0 / .6); --high: #ff8278; --med: #f0b24a; --low: #6fd093;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--desk); color: var(--ink);
    font: 15px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 20px; align-items: start; }

  /* ---------- view switcher ---------- */
  .rail {
    position: sticky; top: max(24px, env(safe-area-inset-top, 0px));
    display: grid; gap: 6px; padding: 8px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  }
  .rail button {
    display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .rail button:hover { color: var(--ink); }
  .rail button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .rail svg { width: 24px; height: 24px; }

  .app { display: grid; gap: 18px; min-width: 0; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1;
    letter-spacing: -.01em; margin: 0; text-wrap: balance;
  }
  .sync { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stats { display: flex; gap: 6px 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 500; }

  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
  }
  input[type=text], input[type=date], input[type=search], select, textarea {
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0;
  }
  textarea { width: 100%; resize: vertical; }
  button {
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; cursor: pointer; line-height: 1.2;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.06); }
  .danger { color: var(--high); border-color: currentColor; font-weight: 600; }

  /* ---------- ticket form (new and edit) ---------- */
  .new-ticket { padding: 16px; display: grid; gap: 12px; }
  .new-ticket.closed { padding: 0; background: none; border: 0; box-shadow: none; }
  .nt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nt-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; }
  .new-toggle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 16px; border: 1.5px dashed var(--line); border-radius: 8px;
    background: transparent; color: var(--accent); font-weight: 600; font-size: 15px;
  }
  .new-toggle:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .nt-status { font-size: 13px; color: var(--low); text-align: center; }
  .nt-status:empty { display: none; }
  .plus {
    display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 600; line-height: 1;
  }
  .ticket-form { display: grid; gap: 12px 18px; grid-template-columns: minmax(0, 1fr); }
  .f { display: grid; gap: 4px; min-width: 0; }
  .f-label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  .f input, .f select, .f textarea { width: 100%; }
  .f-company input { font-size: 18px; font-weight: 600; }
  .time { display: inline-flex; align-items: center; gap: 6px; }
  .time input {
    width: 3.4em; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .colon { font-family: var(--mono); font-weight: 600; font-size: 18px; color: var(--muted); }
  .f-hint { font-size: 12px; color: var(--muted); }
  .f-notes textarea { min-height: 120px; }
  .f-actions { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .f-actions .primary { padding: 9px 18px; }
  .form-error { font-size: 13px; color: var(--high); }
  @media (min-width: 761px) {
    .ticket-form { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    .ticket-form .f-company { grid-column: 1; grid-row: 1; }
    .ticket-form .f-role { grid-column: 1; grid-row: 2; }
    .ticket-form .f-notes { grid-column: 1; grid-row: 3 / span 4; display: flex; flex-direction: column; }
    .ticket-form .f-notes textarea { flex: 1; }
    .ticket-form .f-date { grid-column: 2; grid-row: 1; }
    .ticket-form .f-time { grid-column: 2; grid-row: 2; }
    .ticket-form .f-day { grid-column: 2; grid-row: 3; }
    .ticket-form .f-stage { grid-column: 2; grid-row: 4; }
    .ticket-form .f-actions { grid-column: 2; grid-row: 5; }
    .ticket-form .form-error { grid-column: 2; grid-row: 6; }
  }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 180px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; padding: 7px 12px; }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .colnav { display: none; gap: 6px; flex-wrap: wrap; }
  .colnav button { font-size: 13px; padding: 5px 10px; border-radius: 999px; }

  /* stage colors: shared by column dots and stage chips */
  [data-stage=reverts] { --stage: var(--accent); }
  [data-stage=round1] { --stage: var(--med); }
  [data-stage=round2] { --stage: var(--low); }
  [data-stage=rejected] { --stage: var(--high); }
  .stage-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); }
  .stage-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--stage); }

  /* ---------- board ---------- */
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
  .col-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.2; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--stage); flex: none; }
  .count {
    margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums;
  }
  ul.cards {
    list-style: none; margin: 0; padding: 10px; display: grid; gap: 8px; align-content: start;
    min-height: 140px; border-radius: 0 0 8px 8px; transition: background-color .12s;
  }
  ul.cards.over { background: var(--accent-soft); }

  li.card {
    background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .06); display: grid; gap: 2px; min-width: 0; cursor: pointer;
  }
  li.card:hover { border-color: var(--muted); }
  li.card.dragging { opacity: .45; }
  .company { font-family: var(--display); font-weight: 600; font-size: 16.5px; line-height: 1.25; overflow-wrap: anywhere; }
  .role { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .when {
    display: flex; align-items: flex-start; gap: 6px; margin-top: 6px;
    font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .when svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--muted); }
  .when.none { color: var(--muted); font-family: var(--body); }
  .is-done .company { text-decoration: line-through; color: var(--muted); }

  /* ---------- list ---------- */
  .list-panel { padding: 4px 16px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.task {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start;
    padding: 12px 0; border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  li.task:last-child { border-bottom: 0; }
  li.task .when { margin-top: 4px; }
  .check { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; border: 1px dashed var(--line); border-radius: 7px; cursor: default; }
  ul.list .empty { border: 0; padding: 28px 0; font-size: 14px; }

  footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .note { font-size: 13px; color: var(--muted); margin-right: auto; }
  .note.err { color: var(--high); }
  .confirm { font-size: 13px; }

  /* ---------- ticket details ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 20; background: var(--scrim);
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet {
    width: min(640px, 100%); max-height: 100%; overflow: auto;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 20px 50px rgb(0 0 0 / .25); padding: 18px 20px 20px; display: grid; gap: 14px;
  }
  .d-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .x { border: 0; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
  .d-company { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
  .d-role { color: var(--muted); font-size: 16px; margin-top: 2px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
  .facts div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .facts dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .facts dd { margin: 2px 0 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .d-section h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
  .d-notes { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .d-notes.none { color: var(--muted); }
  .d-meta { font-size: 12px; color: var(--muted); }
  .d-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
  .d-actions .spacer { flex: 1; }
  .d-actions label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .sheet .ticket-form { grid-template-columns: minmax(0, 1fr); }
  .sheet .ticket-form > * { grid-column: auto; grid-row: auto; }

  @media (max-width: 1080px) and (min-width: 761px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 60px minmax(0, 1fr); gap: 10px; }
    .rail { padding: 5px; }
    .rail button { padding: 8px 2px 6px; font-size: 11px; }
    .rail svg { width: 22px; height: 22px; }
    h1 { font-size: 24px; }
    .colnav { display: flex; }
    .board {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 88%;
      overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      margin-right: -16px; padding: 0 16px 6px 0;
    }
    .col { scroll-snap-align: start; }
    .list-panel { padding: 4px 12px; }
    li.task { grid-template-columns: 22px 1fr; }
    li.task .stage-chip { grid-column: 2; }
    .scrim { align-items: flex-end; padding: max(24px, env(safe-area-inset-top, 0px)) 0 0; }
    .sheet {
      width: 100%; border-radius: 14px 14px 0 0; border-bottom: 0;
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .facts div:first-child { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { ul.cards { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Switch view">
    <button type="button" data-view="board" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg>
      <span>Board</span>
    </button>
    <button type="button" data-view="list" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="4" height="4" rx="1"/><path d="M10 6.5h11"/><rect x="3" y="10" width="4" height="4" rx="1"/><path d="M10 12h11"/><rect x="3" y="15.5" width="4" height="4" rx="1"/><path d="M10 17.5h11"/></svg>
      <span>List</span>
    </button>
  </nav>

  <main class="app">
    <header class="top">
      <div>
        <h1>Task Notepad</h1>
        <div class="sync" id="sync">Loading your tickets…</div>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="new-ticket panel closed" id="newTicket">
      <button type="button" class="new-toggle" id="newToggle" data-act="new-open" aria-expanded="false" aria-controls="newTicketBody">
        <span class="plus" aria-hidden="true">+</span>New ticket
      </button>
      <div class="nt-status" id="ntStatus" role="status"></div>
      <div class="new-ticket" id="newTicketBody" style="padding:0" hidden>
        <div class="nt-head"><h2 id="newTicketTitle">New ticket</h2>
          <button type="button" class="x" data-act="new-close" aria-label="Close new ticket">×</button></div>
        <form class="ticket-form" id="addForm" autocomplete="off" novalidate aria-labelledby="newTicketTitle"></form>
      </div>
    </section>

    <div class="toolbar">
      <div class="colnav" id="colnav" role="group" aria-label="Jump to column"></div>
      <div class="tabs" id="tabs" role="group" aria-label="Show" hidden>
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <input type="search" id="search" placeholder="Search companies, roles and notes" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="created">Newest first</option>
        <option value="date">Interview date</option>
      </select>
    </div>

    <div class="board" id="boardView"></div>

    <div class="list-panel panel" id="listView" hidden>
      <ul class="list" id="list"></ul>
    </div>

    <footer>
      <span class="note" id="note" role="status"></span>
      <span id="clearWrap"></span>
      <button type="button" id="exportBtn" hidden>Export</button>
      <button type="button" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </footer>
  </main>
</div>

<div class="scrim" id="detail" hidden></div>

<script>
const STAGES = ['reverts', 'round1', 'round2', 'rejected'];
const STAGE_NAME = { reverts: 'Reverts', round1: 'Interview Round 1', round2: 'Interview Round 2', rejected: 'Rejections' };
const STAGE_SHORT = { reverts: 'reverts', round1: 'round 1', round2: 'round 2', rejected: 'rejections' };
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const LOCAL_KEY = 'task-notepad.v1';
const VIEW_KEY = 'task-notepad.view';
const CAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
const $ = (s) => document.querySelector(s);

let tasks = [];
let view = 'board';
let filter = 'all';
let confirmingId = null;
let store = null;
let openId = null;       // ticket shown in the details panel
let detailMode = 'view'; // 'view' or 'edit'
let lastFocus = null;

try { if (['board', 'list'].includes(localStorage.getItem(VIEW_KEY))) view = localStorage.getItem(VIEW_KEY); } catch {}

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso, long) {
  return new Date(iso + 'T00:00').toLocaleDateString(undefined, long
    ? { month: 'long', day: 'numeric', year: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}
function dayOf(iso) {
  return DAYS[(new Date(iso + 'T00:00').getDay() + 6) % 7];
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function newId() {
  return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
// A ticket: company, role, interview date, time (HH:MM), day, notes, board column and a done tick.
// Tasks saved by earlier versions keep their title as the company and their due date as the date.
function clean(t) {
  const date = [t.date, t.due].find((d) => /^\d{4}-\d{2}-\d{2}$/.test(d || '')) || null;
  return {
    company: String(t.company || t.title || '').slice(0, 300),
    role: String(t.role || '').slice(0, 300),
    date,
    time: /^([01]\d|2[0-3]):[0-5]\d$/.test(t.time || '') ? t.time : '',
    day: DAYS.includes(t.day) ? t.day : (date && !('day' in t) ? dayOf(date) : ''),
    notes: String(t.notes || '').slice(0, 10000),
    stage: STAGES.includes(t.stage) ? t.stage : 'reverts',
    done: !!t.done || t.status === 'done',
    created: Number(t.created) || Date.now(),
  };
}
function whenParts(t) {
  return [t.date ? fmtDate(t.date) : '', t.time, t.day].filter(Boolean);
}
function whenHtml(t) {
  const parts = whenParts(t);
  return parts.length
    ? `<div class="when">${CAL_ICON}<span>${parts.map(esc).join(' · ')}</span></div>`
    : `<div class="when none">No interview date yet</div>`;
}
function say(msg, err) {
  const n = $('#note');
  n.textContent = msg || '';
  n.classList.toggle('err', !!err);
}

/* ---------- storage: your claude.ai account, or this browser as a fallback ---------- */

function accountStore(db, uid) {
  const col = db.collection('data/users/' + uid);
  const queues = {};
  // One write at a time per ticket.
  const queued = (id, fn) => (queues[id] = (queues[id] || Promise.resolve()).then(fn, fn));
  return {
    label: 'Saved to your claude.ai account — open this page on any device to see the same tickets.',
    subscribe(cb, onErr) {
      return col.onSnapshot(
        (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        onErr,
      );
    },
    put: (id, t) => queued(id, () => col.doc(id).set(t)),
    patch: (id, p) => queued(id, () => col.doc(id).update(p)),
    remove: (id) => queued(id, () => col.doc(id).delete()),
  };
}

function browserStore() {
  let data = {};
  let listener = () => {};
  try { data = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch {}
  // Earlier versions kept a plain list of tasks; key them by id.
  if (Array.isArray(data)) data = Object.fromEntries(data.filter((t) => t && t.title).map((t) => [t.id || newId(), t]));
  const flush = () => {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch {}
    listener(Object.entries(data).map(([id, t]) => ({ id, ...t })));
  };
  return {
    label: window.claude
      ? 'Saved in this browser only. Sign in to claude.ai to keep tickets across devices.'
      : 'Saved in this browser only. Use Export to back up or move your tickets.',
    subscribe(cb) { listener = cb; flush(); return () => {}; },
    put: async (id, t) => { data[id] = t; flush(); },
    patch: async (id, p) => { if (data[id]) { Object.assign(data[id], p); flush(); } },
    remove: async (id) => { delete data[id]; flush(); },
  };
}

async function write(promise, what) {
  try { await promise; return true; }
  catch (e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') say('You have too many tickets saved. Delete some finished ones to add more.', true);
    else if (code === 'invalid_argument') say(`Couldn't ${what}. You may only have view access to this page.`, true);
    else say(`Couldn't ${what}. Check your connection and try again.`, true);
    return false;
  }
}

function moveTask(t, stage) {
  if (!t || t.stage === stage || !STAGES.includes(stage)) return;
  write(store.patch(t.id, { stage }), 'move that ticket');
}

/* ---------- ticket form (used for new tickets and for editing) ---------- */

function formFields(p, t) {
  const time = (t.time || '').split(':');
  const dayOpts = ['<option value="">Choose a day</option>']
    .concat(DAYS.map((d) => `<option value="${d}" ${t.day === d ? 'selected' : ''}>${d}</option>`)).join('');
  const stageOpts = STAGES.map((s) => `<option value="${s}" ${(t.stage || 'reverts') === s ? 'selected' : ''}>${STAGE_NAME[s]}</option>`).join('');
  return `
    <label class="f f-company"><span class="f-label">Company name</span>
      <input type="text" id="${p}Company" name="company" value="${esc(t.company || '')}" placeholder="e.g. Acme Corp" maxlength="300"></label>
    <label class="f f-role"><span class="f-label">Job role</span>
      <input type="text" id="${p}Role" name="role" value="${esc(t.role || '')}" placeholder="e.g. Product Designer" maxlength="300"></label>
    <label class="f f-date"><span class="f-label">Interview date</span>
      <input type="date" id="${p}Date" name="date" value="${t.date || ''}"></label>
    <div class="f f-time"><span class="f-label" id="${p}TimeLabel">Time <span class="f-hint">(24-hour)</span></span>
      <div class="time" role="group" aria-labelledby="${p}TimeLabel">
        <input type="text" id="${p}Hour" name="hour" value="${time[0] || ''}" inputmode="numeric" maxlength="2" placeholder="HH" aria-label="Hour" data-hour>
        <span class="colon" aria-hidden="true">:</span>
        <input type="text" id="${p}Minute" name="minute" value="${time[1] || ''}" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Minutes" data-minute>
      </div></div>
    <label class="f f-day"><span class="f-label">Day</span>
      <select id="${p}Day" name="day">${dayOpts}</select></label>
    <label class="f f-notes"><span class="f-label">Notes</span>
      <textarea id="${p}Notes" name="notes" rows="5" placeholder="Anything about the role: requirements, who you're meeting, what to prepare">${esc(t.notes || '')}</textarea></label>
    <label class="f f-stage"><span class="f-label">Column</span>
      <select id="${p}Stage" name="stage">${stageOpts}</select></label>`;
}

// Reads a ticket form. Returns the fields, or { error } when something needs fixing.
function readForm(f) {
  const v = (n) => f.elements.namedItem(n).value.trim();
  const company = v('company');
  if (!company) return { error: 'Add the company name.', focus: 'company' };
  const h = v('hour'), m = v('minute');
  let time = '';
  if (h || m) {
    const hh = Number(h), mm = Number(m || '0');
    if (!h || !/^\d{1,2}$/.test(h) || hh > 23) return { error: 'Hours go from 00 to 23.', focus: 'hour' };
    if (!/^\d{0,2}$/.test(m) || mm > 59) return { error: 'Minutes go from 00 to 59.', focus: 'minute' };
    time = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }
  const date = v('date');
  return {
    company, role: v('role'),
    date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null,
    time, day: DAYS.includes(v('day')) ? v('day') : '',
    notes: f.elements.namedItem('notes').value.trim(),
    stage: STAGES.includes(v('stage')) ? v('stage') : 'reverts',
  };
}
function showFormError(f, res) {
  let box = f.querySelector('.form-error');
  if (!box) { box = document.createElement('div'); box.className = 'form-error'; box.setAttribute('role', 'alert'); f.appendChild(box); }
  box.textContent = res ? res.error : '';
  box.hidden = !res;
  if (res && res.focus) f.elements.namedItem(res.focus).focus();
}

function resetAddForm(stage) {
  const f = $('#addForm');
  f.innerHTML = formFields('new', { stage }) +
    `<div class="f-actions"><button class="primary" type="submit">Create ticket</button><button type="button" data-act="new-close">Cancel</button></div>`;
}
// The new-ticket form stays folded behind the "+ New ticket" button until it's needed.
function setNewTicketOpen(open) {
  $('#newTicket').classList.toggle('closed', !open);
  $('#newTicketBody').hidden = !open;
  $('#newToggle').hidden = open;
  $('#newToggle').setAttribute('aria-expanded', String(open));
  $('#ntStatus').textContent = '';
  if (open) $('#newCompany').focus();
  else { resetAddForm($('#newStage') ? $('#newStage').value : 'reverts'); $('#newToggle').focus(); }
}

/* ---------- rendering ---------- */

function matches(t) {
  const q = $('#search').value.trim().toLowerCase();
  return !q || (t.company + ' ' + t.role + ' ' + t.notes).toLowerCase().includes(q);
}
function sorted(list) {
  const byDate = $('#sort').value === 'date';
  return list.sort((a, b) => byDate
    ? ((a.date || '9999-99-99') + (a.time || '99:99')).localeCompare((b.date || '9999-99-99') + (b.time || '99:99')) || b.created - a.created
    : b.created - a.created);
}

function render() {
  const t0 = today();
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  $('#boardView').hidden = view !== 'board';
  $('#listView').hidden = view !== 'list';
  $('#tabs').hidden = view !== 'list';
  $('#colnav').hidden = view !== 'board';

  const upcoming = tasks.filter((t) => !t.done && t.date && t.date >= t0).length;
  const up = `<span><b>${upcoming}</b> upcoming</span>`;
  if (view === 'board') {
    $('#stats').innerHTML = STAGES.map((s) => `<span><b>${tasks.filter((t) => t.stage === s).length}</b> ${STAGE_SHORT[s]}</span>`).join('') + up;
    renderBoard();
  } else {
    const active = tasks.filter((t) => !t.done).length;
    $('#stats').innerHTML = `<span><b>${active}</b> active</span><span><b>${tasks.length - active}</b> done</span>` + up;
    renderList();
  }

  const doneCount = tasks.filter((t) => t.done).length;
  $('#clearWrap').innerHTML = confirmingId === '__clear'
    ? `<span class="confirm">Remove ${doneCount} completed ticket${doneCount === 1 ? '' : 's'}?</span> <button type="button" class="danger" data-act="clear-yes">Remove</button> <button type="button" data-act="clear-no">Keep</button>`
    : `<button type="button" data-act="clear" ${doneCount ? '' : 'disabled'}>Clear completed</button>`;

  renderDetail();
}

function renderBoard() {
  const board = $('#boardView');
  if (!board.children.length) {
    board.innerHTML = STAGES.map((s) => `
      <section class="col panel" id="col-${s}" data-stage="${s}">
        <div class="col-head"><span class="dot"></span><h2>${STAGE_NAME[s]}</h2><span class="count" id="count-${s}">0</span></div>
        <ul class="cards" data-stage="${s}"></ul>
      </section>`).join('');
    $('#colnav').innerHTML = STAGES.map((s) => `<button type="button" data-jump="${s}">${STAGE_NAME[s]}</button>`).join('');
  }
  for (const s of STAGES) {
    const all = tasks.filter((t) => t.stage === s);
    $('#count-' + s).textContent = all.length;
    const shown = sorted(all.filter(matches));
    board.querySelector(`ul.cards[data-stage=${s}]`).innerHTML = shown.length
      ? shown.map((t) => `
        <li class="card ${t.done ? 'is-done' : ''}" draggable="true" tabindex="0" data-open="${esc(t.id)}" aria-label="Open ticket: ${esc(t.company)}">
          <div class="company">${esc(t.company)}</div>
          ${t.role ? `<div class="role">${esc(t.role)}</div>` : ''}
          ${whenHtml(t)}
        </li>`).join('')
      : `<li class="empty">${all.length ? 'No matches here.' : (s === 'reverts' && !tasks.length ? 'Press + New ticket above to add one.' : 'Drag a ticket here, or open one and use Move to.')}</li>`;
  }
}

function renderList() {
  const list = $('#list');
  const items = sorted(tasks.filter((t) => filter === 'all' || (filter === 'done') === t.done).filter(matches));
  if (!items.length) {
    list.innerHTML = `<li class="empty">${tasks.length ? 'Nothing matches. Try another filter or search.' : 'No tickets yet. Press + New ticket above to add one.'}</li>`;
    return;
  }
  list.innerHTML = items.map((t) => `
    <li class="task ${t.done ? 'is-done' : ''}" data-id="${esc(t.id)}" data-open="${esc(t.id)}" tabindex="0" aria-label="Open ticket: ${esc(t.company)}">
      <input type="checkbox" class="check" data-act="toggle" ${t.done ? 'checked' : ''} aria-label="Mark ${esc(t.company)} done">
      <div>
        <div class="company">${esc(t.company)}</div>
        ${t.role ? `<div class="role">${esc(t.role)}</div>` : ''}
        ${whenHtml(t)}
      </div>
      <span class="stage-chip" data-stage="${t.stage}">${STAGE_NAME[t.stage]}</span>
    </li>`).join('');
}

function renderDetail() {
  const box = $('#detail');
  const t = openId && tasks.find((x) => x.id === openId);
  if (!t) { if (openId) closeDetail(); box.hidden = true; return; }
  box.hidden = false;
  if (detailMode === 'edit') {
    if (box.querySelector('#editForm')) return; // keep what the viewer is typing
    box.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dHead" data-id="${esc(t.id)}">
        <div class="d-top"><h2 class="d-company" id="dHead" style="font-size:20px">Edit ticket</h2>
          <button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
        <form class="ticket-form" id="editForm" autocomplete="off" novalidate>
          ${formFields('edit', t)}
          <div class="f-actions"><button class="primary" type="submit">Save</button><button type="button" data-act="cancel">Cancel</button></div>
        </form>
      </div>`;
    $('#editCompany').focus();
    return;
  }
  const stageOpts = STAGES.map((s) => `<option value="${s}" ${s === t.stage ? 'selected' : ''}>${STAGE_NAME[s]}</option>`).join('');
  const actions = confirmingId === t.id
    ? `<span class="confirm">Delete this ticket for good?</span><span class="spacer"></span>
       <button type="button" class="danger" data-act="del-yes">Delete</button><button type="button" data-act="del-no">Keep</button>`
    : `<label>Move to <select data-act="stage" aria-label="Move to column">${stageOpts}</select></label>
       <label><input type="checkbox" class="check" data-act="toggle" ${t.done ? 'checked' : ''}> Done</label>
       <span class="spacer"></span>
       <button type="button" data-act="edit">Edit</button><button type="button" data-act="del">Delete</button>`;
  box.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dHead" data-id="${esc(t.id)}">
      <div class="d-top"><span class="stage-chip" data-stage="${t.stage}">${STAGE_NAME[t.stage]}${t.done ? ' · done' : ''}</span>
        <button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
      <div>
        <h2 class="d-company" id="dHead">${esc(t.company)}</h2>
        <div class="d-role">${t.role ? esc(t.role) : 'No job role added'}</div>
      </div>
      <dl class="facts">
        <div><dt>Interview date</dt><dd>${t.date ? fmtDate(t.date, true) : '—'}</dd></div>
        <div><dt>Time</dt><dd>${t.time || '—'}</dd></div>
        <div><dt>Day</dt><dd>${t.day || '—'}</dd></div>
      </dl>
      ${t.date && t.day && dayOf(t.date) !== t.day ? `<div class="d-meta">Heads up: ${fmtDate(t.date, true)} is a ${dayOf(t.date)}.</div>` : ''}
      <section class="d-section"><h3>Notes</h3>
        <p class="d-notes ${t.notes ? '' : 'none'}">${t.notes ? esc(t.notes) : 'No notes yet. Use Edit to add some.'}</p></section>
      ${t.created > 1.6e12 ? `<div class="d-meta">Created ${new Date(t.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</div>` : ''}
      <div class="d-actions">${actions}</div>
    </div>`;
}

function openDetail(id) {
  lastFocus = document.activeElement;
  openId = id; detailMode = 'view'; confirmingId = null;
  renderDetail();
  const x = $('#detail .x');
  if (x) x.focus();
}
function closeDetail() {
  openId = null; detailMode = 'view';
  if (confirmingId && confirmingId !== '__clear') confirmingId = null;
  const box = $('#detail');
  box.hidden = true; box.innerHTML = '';
  const back = lastFocus && lastFocus.dataset && lastFocus.dataset.open && document.querySelector(`[data-open="${CSS.escape(lastFocus.dataset.open)}"]`);
  if (back) back.focus();
  lastFocus = null;
}

/* ---------- interactions ---------- */

$('#addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = readForm(f);
  if (res.error) { showFormError(f, res); return; }
  showFormError(f, null);
  if (!store) return;
  resetAddForm(res.stage);  // the next ticket starts in the same column
  setNewTicketOpen(false);
  say('');
  if (await write(store.put(newId(), { ...res, done: false, created: Date.now() }), 'create that ticket')) {
    $('#ntStatus').textContent = `Created ${res.company} in ${STAGE_NAME[res.stage]}.`;
  }
});

// Time boxes: digits only, and jump to minutes after two hour digits.
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('[data-hour], [data-minute]')) {
    el.value = el.value.replace(/\D/g, '').slice(0, 2);
    if (el.matches('[data-hour]') && el.value.length === 2) el.form.elements.namedItem('minute').focus();
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  // Picking a date fills in its day of the week; you can still change the day.
  if (el.name === 'date' && el.form && el.value) el.form.elements.namedItem('day').value = dayOf(el.value);
  if (el.dataset.act === 'stage') {
    const holder = el.closest('[data-id]');
    moveTask(tasks.find((x) => x.id === holder.dataset.id), el.value);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.id === 'detail') { closeDetail(); return; }  // click outside the panel
  const el = e.target.closest('[data-act], [data-jump], [data-view], [data-filter]');
  if (!el) {
    const opener = e.target.closest('[data-open]');
    if (opener) openDetail(opener.dataset.open);
    return;
  }
  if (el.dataset.view) {
    view = el.dataset.view;
    confirmingId = null;
    try { localStorage.setItem(VIEW_KEY, view); } catch {}
    render();
    return;
  }
  if (el.dataset.filter) {
    filter = el.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x === el)));
    render();
    return;
  }
  if (el.dataset.jump) {
    $('#col-' + el.dataset.jump).scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
    return;
  }
  const holder = el.closest('[data-id]');
  const t = holder && tasks.find((x) => x.id === holder.dataset.id);
  switch (el.dataset.act) {
    case 'toggle': write(store.patch(t.id, { done: el.checked }), 'update that ticket'); break;
    case 'close': closeDetail(); break;
    case 'new-open': setNewTicketOpen(true); break;
    case 'new-close': setNewTicketOpen(false); break;
    case 'edit': detailMode = 'edit'; confirmingId = null; renderDetail(); break;
    case 'cancel': detailMode = 'view'; renderDetail(); $('#detail .x').focus(); break;
    case 'del': confirmingId = t.id; renderDetail(); break;
    case 'del-no': confirmingId = null; renderDetail(); break;
    case 'del-yes': confirmingId = null; closeDetail(); write(store.remove(t.id), 'delete that ticket'); break;
    case 'clear': confirmingId = '__clear'; render(); break;
    case 'clear-no': confirmingId = null; render(); break;
    case 'clear-yes':
      confirmingId = null;
      tasks.filter((x) => x.done).forEach((x) => write(store.remove(x.id), 'clear completed tickets'));
      render();
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openId) { closeDetail(); return; }
  if (e.key === 'Escape' && !$('#newTicketBody').hidden) { setNewTicketOpen(false); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) {
    e.preventDefault();
    openDetail(e.target.dataset.open);
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'editForm') return;
  e.preventDefault();
  const f = e.target;
  const res = readForm(f);
  if (res.error) { showFormError(f, res); return; }
  const id = openId;
  detailMode = 'view';
  write(store.patch(id, res), 'save your changes');
  renderDetail();
  $('#detail .x') && $('#detail .x').focus();
});

// Drag tickets between columns (mouse and trackpad; on phones open a ticket and use Move to).
let dragId = null;
const boardEl = $('#boardView');
boardEl.addEventListener('dragstart', (e) => {
  const li = e.target.closest && e.target.closest('li.card');
  if (!li) return;
  dragId = li.dataset.open;
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch {}
});
boardEl.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging, .over').forEach((el) => el.classList.remove('dragging', 'over'));
});
boardEl.addEventListener('dragover', (e) => {
  const ul = e.target.closest('ul.cards');
  if (!ul || !dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('ul.cards.over').forEach((x) => x !== ul && x.classList.remove('over'));
  ul.classList.add('over');
});
boardEl.addEventListener('dragleave', (e) => {
  const ul = e.target.closest('ul.cards');
  if (ul && !ul.contains(e.relatedTarget)) ul.classList.remove('over');
});
boardEl.addEventListener('drop', (e) => {
  const ul = e.target.closest('ul.cards');
  if (!ul || !dragId) return;
  e.preventDefault();
  ul.classList.remove('over');
  moveTask(tasks.find((x) => x.id === dragId), ul.dataset.stage);
});

$('#search').addEventListener('input', render);
$('#sort').addEventListener('change', render);

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !store) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error('not a list');
    const have = new Set(tasks.map((t) => t.id));
    const fresh = data.filter((t) => t && (t.company || t.title) && !have.has(t.id));
    for (const t of fresh) {
      const id = typeof t.id === 'string' && /^[A-Za-z0-9_.~:@+-]{1,100}$/.test(t.id) && t.id !== '.' && t.id !== '..' ? t.id : newId();
      await write(store.put(id, clean(t)), 'import tickets');
    }
    say(fresh.length ? `Imported ${fresh.length} ticket${fresh.length > 1 ? 's' : ''}.` : 'Those tickets are already here.');
  } catch {
    say('That file isn\'t a Task Notepad export. Choose a .json file made with Export.', true);
  }
});

/* ---------- start ---------- */

function start(s) {
  store = s;
  $('#sync').textContent = s.label;
  s.subscribe(
    (rows) => {
      tasks = rows.map((r) => ({ id: r.id, ...clean(r) }));
      render();
    },
    () => say('Lost the connection to your saved tickets. Reload the page to reconnect.', true),
  );
}

resetAddForm('reverts');
render();

      const json = JSON.stringify(data, null, 2);
      if (downloads) {
        try { await downloads.save({ filename, data: json }); } catch { /* the viewer declined the save */ }
        return;
      }
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: filename,
      });
      a.click();
      URL.revokeObjectURL(a.href);
    });
  }
})();
</script>
<script>
  // Installed as an app: work offline, and ask the browser not to clear saved tasks when space runs low.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
