<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Task Notepad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: a Kanban board on a desk — header and add form on top, then three paper columns
     (To do, In progress, Done) holding task cards. On phones the columns become a swipeable row. */
  :root {
    --desk: #e9ecef;
    --paper: #fbf8e9;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #64707d;
    --accent: #2457c5;
    --accent-ink: #ffffff;
    --field: #ffffff;
    --line: #d6d9d2;
    --drop: #dfe8fb;
    --high: #c23a31;
    --med: #b0700c;
    --low: #2f8551;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #11151b; --paper: #1a2029; --card: #232b36; --ink: #e7ebf0; --muted: #94a0ae;
      --accent: #7ea3ff; --accent-ink: #0d1422; --field: #222a35; --line: #313b49; --drop: #23324d;
      --high: #ff8278; --med: #f0b24a; --low: #6fd093;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #11151b; --paper: #1a2029; --card: #232b36; --ink: #e7ebf0; --muted: #94a0ae;
    --accent: #7ea3ff; --accent-ink: #0d1422; --field: #222a35; --line: #313b49; --drop: #23324d;
    --high: #ff8278; --med: #f0b24a; --low: #6fd093;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--desk); color: var(--ink);
    font: 15px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1;
    letter-spacing: -.01em; margin: 0; text-wrap: balance;
  }
  .sync { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 500; }
  .stats .od b { color: var(--high); }

  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
  }
  form.add { padding: 14px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { min-width: 0; }
  input[type=text], input[type=date], input[type=search], select, textarea {
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  #newTitle { flex: 1 1 240px; }
  textarea { width: 100%; resize: vertical; min-height: 40px; }
  button {
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; cursor: pointer; line-height: 1.2;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.06); }
  .danger { color: var(--high); border-color: currentColor; font-weight: 600; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 180px; }
  .colnav { display: none; gap: 6px; }
  .colnav button { font-size: 13px; padding: 5px 10px; border-radius: 999px; }

  /* ---------- board ---------- */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .col-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .col[data-status=doing] .dot { background: var(--accent); }
  .col[data-status=done] .dot { background: var(--low); }
  .count {
    margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums;
  }
  ul.cards {
    list-style: none; margin: 0; padding: 10px; display: grid; gap: 8px; align-content: start;
    min-height: 140px; border-radius: 0 0 8px 8px; transition: background-color .12s;
  }
  ul.cards.over { background: var(--drop); }

  li.card {
    background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .06); display: grid; gap: 6px; min-width: 0;
  }
  li.card[draggable=true] { cursor: grab; }
  li.card.dragging { opacity: .45; }
  .c-title { font-weight: 600; overflow-wrap: anywhere; }
  .col[data-status=done] .c-title { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .c-notes { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .pill {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    border: 1px solid currentColor; border-radius: 999px; padding: 0 7px;
  }
  .p-high { color: var(--high); } .p-medium { color: var(--med); } .p-low { color: var(--low); }
  .due { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .overdue { color: var(--high); font-weight: 500; }
  .c-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding-top: 2px; }
  .c-actions button { padding: 3px 8px; font-size: 12.5px; }
  .c-actions .spacer { flex: 1; }
  .move { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); font-weight: 500; }
  .confirm { font-size: 13px; }

  form.edit { display: grid; gap: 8px; }
  form.edit input[type=text] { width: 100%; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; border: 1px dashed var(--line); border-radius: 7px; }

  footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .note { font-size: 13px; color: var(--muted); margin-right: auto; }
  .note.err { color: var(--high); }

  /* phones: swipe between columns */
  @media (max-width: 760px) {
    h1 { font-size: 26px; }
    .colnav { display: flex; }
    .board {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 86%;
      overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      margin-inline: -16px; padding: 0 16px 6px; scroll-padding-inline: 16px;
    }
    .col { scroll-snap-align: start; }
  }
  @media (prefers-reduced-motion: reduce) { ul.cards { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>Task Notepad</h1>
      <div class="sync" id="sync">Loading your tasks…</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <form class="add panel" id="addForm" autocomplete="off">
    <div class="row">
      <input type="text" id="newTitle" placeholder="What needs doing?" required aria-label="Task">
      <select id="newPriority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="newDue" aria-label="Due date">
      <select id="newStatus" aria-label="Column">
        <option value="todo" selected>To do</option>
        <option value="doing">In progress</option>
      </select>
      <button class="primary" type="submit">Add task</button>
    </div>
    <textarea id="newNotes" rows="2" placeholder="Notes (optional)" aria-label="Notes"></textarea>
  </form>

  <div class="toolbar">
    <div class="colnav" role="group" aria-label="Jump to column">
      <button type="button" data-jump="todo">To do</button>
      <button type="button" data-jump="doing">In progress</button>
      <button type="button" data-jump="done">Done</button>
    </div>
    <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
    <select id="sort" aria-label="Sort cards">
      <option value="created">Newest first</option>
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
    </select>
  </div>

  <div class="board" id="board">
    <section class="col panel" data-status="todo" id="col-todo">
      <div class="col-head"><span class="dot"></span><h2>To do</h2><span class="count" id="count-todo">0</span></div>
      <ul class="cards" data-status="todo"></ul>
    </section>
    <section class="col panel" data-status="doing" id="col-doing">
      <div class="col-head"><span class="dot"></span><h2>In progress</h2><span class="count" id="count-doing">0</span></div>
      <ul class="cards" data-status="doing"></ul>
    </section>
    <section class="col panel" data-status="done" id="col-done">
      <div class="col-head"><span class="dot"></span><h2>Done</h2><span class="count" id="count-done">0</span></div>
      <ul class="cards" data-status="done"></ul>
    </section>
  </div>

  <footer>
    <span class="note" id="note" role="status"></span>
    <span id="clearWrap"></span>
    <button type="button" id="exportBtn" hidden>Export</button>
    <button type="button" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</main>

<script>
const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };
const COLUMNS = ['todo', 'doing', 'done'];
const COLUMN_NAME = { todo: 'To do', doing: 'In progress', done: 'Done' };
const LOCAL_KEY = 'task-notepad.v1';
const $ = (s) => document.querySelector(s);

let tasks = [];
let editingId = null;
let confirmingId = null;
let store = null;

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso) {
  return new Date(iso + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function newId() {
  return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
// Tasks saved before the board existed only have `done`; they land in To do or Done.
function clean(t) {
  const status = COLUMNS.includes(t.status) ? t.status : (t.done ? 'done' : 'todo');
  return {
    title: String(t.title || '').slice(0, 500),
    notes: String(t.notes || '').slice(0, 5000),
    priority: PRIORITY_RANK[t.priority] !== undefined ? t.priority : 'medium',
    due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : null,
    status,
    done: status === 'done',
    created: Number(t.created) || Date.now(),
  };
}
function say(msg, err) {
  const n = $('#note');
  n.textContent = msg || '';
  n.classList.toggle('err', !!err);
}

/* ---------- storage: your claude.ai account, or this browser as a fallback ---------- */

function accountStore(db, uid) {
  const col = db.collection('data/users/' + uid);
  const queues = {};
  // One write at a time per task.
  const queued = (id, fn) => (queues[id] = (queues[id] || Promise.resolve()).then(fn, fn));
  return {
    label: 'Saved to your claude.ai account — open this page on any device to see the same board.',
    subscribe(cb, onErr) {
      return col.onSnapshot(
        (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        onErr,
      );
    },
    put: (id, t) => queued(id, () => col.doc(id).set(t)),
    patch: (id, p) => queued(id, () => col.doc(id).update(p)),
    remove: (id) => queued(id, () => col.doc(id).delete()),
  };
}

function browserStore() {
  let data = {};
  let listener = () => {};
  try { data = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch {}
  // Earlier versions kept a plain list of tasks; key them by id.
  if (Array.isArray(data)) data = Object.fromEntries(data.filter((t) => t && t.title).map((t) => [t.id || newId(), t]));
  const flush = () => {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch {}
    listener(Object.entries(data).map(([id, t]) => ({ id, ...t })));
  };
  return {
    label: window.claude
      ? 'Saved in this browser only. Sign in to claude.ai to keep tasks across devices.'
      : 'Saved in this browser only. Use Export to back up or move your tasks.',
    subscribe(cb) { listener = cb; flush(); return () => {}; },
    put: async (id, t) => { data[id] = t; flush(); },
    patch: async (id, p) => { if (data[id]) { Object.assign(data[id], p); flush(); } },
    remove: async (id) => { delete data[id]; flush(); },
  };
}

async function write(promise, what) {
  try { await promise; }
  catch (e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') say('Your board is full. Delete some finished tasks to add more.', true);
    else if (code === 'invalid_argument') say(`Couldn't ${what}. You may only have view access to this page.`, true);
    else say(`Couldn't ${what}. Check your connection and try again.`, true);
  }
}

function moveTask(t, status) {
  if (!t || t.status === status || !COLUMNS.includes(status)) return;
  write(store.patch(t.id, { status, done: status === 'done' }), 'move that task');
}

/* ---------- rendering ---------- */

function sorted(list) {
  const sort = $('#sort').value;
  return list.sort((a, b) => {
    if (sort === 'due') return (a.due || '9999-99-99').localeCompare(b.due || '9999-99-99') || b.created - a.created;
    if (sort === 'priority') return PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || b.created - a.created;
    return b.created - a.created;
  });
}

function render() {
  const t0 = today();
  const q = $('#search').value.trim().toLowerCase();
  const by = { todo: [], doing: [], done: [] };
  tasks.forEach((t) => by[t.status].push(t));
  const overdue = tasks.filter((t) => t.status !== 'done' && t.due && t.due < t0).length;

  $('#stats').innerHTML =
    COLUMNS.map((c) => `<span><b>${by[c].length}</b> ${COLUMN_NAME[c].toLowerCase()}</span>`).join('') +
    (overdue ? `<span class="od"><b>${overdue}</b> overdue</span>` : '');

  for (const c of COLUMNS) {
    $('#count-' + c).textContent = by[c].length;
    const shown = sorted(by[c].filter((t) => !q || (t.title + ' ' + t.notes).toLowerCase().includes(q)));
    const ul = document.querySelector(`ul.cards[data-status=${c}]`);
    if (!shown.length) {
      const msg = q && by[c].length ? 'No matches here.'
        : c === 'todo' ? (tasks.length ? 'Nothing waiting. Add a task above.' : 'No tasks yet. Add one above and it lands here.')
        : c === 'doing' ? 'Drag a card here, or press Start on it.'
        : 'Finished tasks show up here.';
      ul.innerHTML = `<li class="empty">${msg}</li>`;
    } else {
      ul.innerHTML = shown.map((t) => (t.id === editingId ? editView(t) : cardView(t, t0))).join('');
    }
  }

  const doneCount = by.done.length;
  $('#clearWrap').innerHTML = confirmingId === '__clear'
    ? `<span class="confirm">Remove ${doneCount} finished task${doneCount === 1 ? '' : 's'}?</span> <button type="button" class="danger" data-act="clear-yes">Remove</button> <button type="button" data-act="clear-no">Keep</button>`
    : `<button type="button" data-act="clear" ${doneCount ? '' : 'disabled'}>Clear Done column</button>`;
}

function cardView(t, t0) {
  const late = t.status !== 'done' && t.due && t.due < t0;
  const i = COLUMNS.indexOf(t.status);
  const back = { doing: '← To do', done: '← Reopen' }[t.status];
  const fwd = { todo: 'Start →', doing: 'Done →' }[t.status];
  const actions = confirmingId === t.id
    ? `<span class="confirm">Delete this task?</span><span class="spacer"></span><button type="button" class="danger" data-act="del-yes">Delete</button><button type="button" data-act="del-no">Keep</button>`
    : `${back ? `<button type="button" class="move" data-act="move" data-to="${COLUMNS[i - 1]}">${back}</button>` : ''}` +
      `${fwd ? `<button type="button" class="move" data-act="move" data-to="${COLUMNS[i + 1]}">${fwd}</button>` : ''}` +
      `<span class="spacer"></span><button type="button" data-act="edit">Edit</button><button type="button" data-act="del">Delete</button>`;
  return `
    <li class="card" draggable="true" data-id="${esc(t.id)}">
      <div class="c-title">${esc(t.title)}</div>
      ${t.notes ? `<div class="c-notes">${esc(t.notes)}</div>` : ''}
      <div class="meta">
        <span class="pill p-${t.priority}">${t.priority}</span>
        ${t.due ? `<span class="due ${late ? 'overdue' : ''}">Due ${fmtDate(t.due)}${late ? ' · overdue' : ''}</span>` : ''}
      </div>
      <div class="c-actions">${actions}</div>
    </li>`;
}

function editView(t) {
  const opt = (v) => `<option value="${v}" ${t.priority === v ? 'selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`;
  return `
    <li class="card" data-id="${esc(t.id)}">
      <form class="edit" id="editForm">
        <input type="text" id="editTitle" name="title" value="${esc(t.title)}" required aria-label="Task">
        <div class="row">
          <select id="editPriority" name="priority" aria-label="Priority">${opt('low')}${opt('medium')}${opt('high')}</select>
          <input type="date" id="editDue" name="due" value="${t.due || ''}" aria-label="Due date">
        </div>
        <textarea id="editNotes" name="notes" rows="3" placeholder="Notes (optional)" aria-label="Notes">${esc(t.notes)}</textarea>
        <div class="row">
          <button class="primary" type="submit">Save</button>
          <button type="button" data-act="cancel">Cancel</button>
        </div>
      </form>
    </li>`;
}

/* ---------- interactions ---------- */

$('#addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = $('#newTitle').value.trim();
  if (!title || !store) return;
  const t = clean({
    title, notes: $('#newNotes').value.trim(), priority: $('#newPriority').value,
    due: $('#newDue').value, status: $('#newStatus').value, created: Date.now(),
  });
  e.target.reset();
  $('#newTitle').focus();
  say('');
  write(store.put(newId(), t), 'add that task');
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act], [data-jump]');
  if (!el) return;
  if (el.dataset.jump) {
    $('#col-' + el.dataset.jump).scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
    return;
  }
  const li = el.closest('[data-id]');
  const t = li && tasks.find((x) => x.id === li.dataset.id);
  switch (el.dataset.act) {
    case 'move': moveTask(t, el.dataset.to); break;
    case 'edit': editingId = t.id; confirmingId = null; render(); $('#editTitle').focus(); break;
    case 'cancel': editingId = null; render(); break;
    case 'del': confirmingId = t.id; render(); break;
    case 'del-no': confirmingId = null; render(); break;
    case 'del-yes': confirmingId = null; write(store.remove(t.id), 'delete that task'); break;
    case 'clear': confirmingId = '__clear'; render(); break;
    case 'clear-no': confirmingId = null; render(); break;
    case 'clear-yes':
      confirmingId = null;
      tasks.filter((x) => x.status === 'done').forEach((x) => write(store.remove(x.id), 'clear the Done column'));
      render();
      break;
  }
});

$('#board').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const t = tasks.find((x) => x.id === editingId);
  if (!t) return;
  const patch = {
    title: f.title.value.trim() || t.title, notes: f.notes.value.trim(),
    priority: f.priority.value, due: f.due.value || null,
  };
  editingId = null;
  render();
  write(store.patch(t.id, patch), 'save your changes');
});

// Drag cards between columns (mouse and trackpad; on phones use the Start / Done buttons).
let dragId = null;
const board = $('#board');
board.addEventListener('dragstart', (e) => {
  const li = e.target.closest('li.card[draggable=true]');
  if (!li) return;
  dragId = li.dataset.id;
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch {}
});
board.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging, .over').forEach((el) => el.classList.remove('dragging', 'over'));
});
board.addEventListener('dragover', (e) => {
  const ul = e.target.closest('ul.cards');
  if (!ul || !dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('ul.cards.over').forEach((x) => x !== ul && x.classList.remove('over'));
  ul.classList.add('over');
});
board.addEventListener('dragleave', (e) => {
  const ul = e.target.closest('ul.cards');
  if (ul && !ul.contains(e.relatedTarget)) ul.classList.remove('over');
});
board.addEventListener('drop', (e) => {
  const ul = e.target.closest('ul.cards');
  if (!ul || !dragId) return;
  e.preventDefault();
  ul.classList.remove('over');
  moveTask(tasks.find((x) => x.id === dragId), ul.dataset.status);
});

$('#search').addEventListener('input', render);
$('#sort').addEventListener('change', render);

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !store) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error('not a list');
    const have = new Set(tasks.map((t) => t.id));
    const fresh = data.filter((t) => t && t.title && !have.has(t.id));
    for (const t of fresh) {
      const id = typeof t.id === 'string' && /^[A-Za-z0-9_.~:@+-]{1,100}$/.test(t.id) && t.id !== '.' && t.id !== '..' ? t.id : newId();
      await write(store.put(id, clean(t)), 'import tasks');
    }
    say(fresh.length ? `Imported ${fresh.length} task${fresh.length > 1 ? 's' : ''}.` : 'Those tasks are already on your board.');
  } catch {
    say('That file isn\'t a Task Notepad export. Choose a .json file made with Export.', true);
  }
});

/* ---------- start ---------- */

function start(s) {
  store = s;
  $('#sync').textContent = s.label;
  s.subscribe(
    (rows) => {
      tasks = rows.map((r) => ({ id: r.id, ...clean(r) }));
      if (editingId && !tasks.some((t) => t.id === editingId)) editingId = null;
      render();
    },
    () => say('Lost the connection to your saved tasks. Reload the page to reconnect.', true),
  );
}

render();
(async () => {
  const cl = window.claude;
  const [db, user, downloads] = cl && cl.use
    ? await Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads')])
    : [null, null, null];
  const uid = user ? await user.id() : null;
  start(db && uid ? accountStore(db, uid) : browserStore());

  // On claude.ai, saves go through the downloads capability; opened as a plain file, a normal download works.
  if (downloads || !cl) {
    const btn = $('#exportBtn');
    btn.hidden = false;
    btn.addEventListener('click', async () => {
      const data = tasks.map(({ id, title, notes, priority, due, status, done, created }) => ({ id, title, notes, priority, due, status, done, created }));
      const filename = `tasks-${today()}.json`;
      const json = JSON.stringify(data, null, 2);
      if (downloads) {
        try { await downloads.save({ filename, data: json }); } catch { /* the viewer declined the save */ }
        return;
      }
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: filename,
      });
      a.click();
      URL.revokeObjectURL(a.href);
    });
  }
})();
</script>
<script>
  // Installed as an app: work offline, and ask the browser not to clear saved tasks when space runs low.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
